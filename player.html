<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1220">
<title>科技島大富翁 — 我的平板</title>
<link rel="stylesheet" href="css/style.css?v=20260822-2015">
</head>
<body class="player">

<!-- ══ 重新連線中 ══ -->
<div id="rejoin" class="player-wrap hidden">
  <div class="pl-card" style="text-align:center">
    <h3>正在回到遊戲…</h3>
    <div class="rejoin-info" id="rejoinInfo"></div>
    <button id="btnCancelRejoin" class="ghost" style="width:100%;margin-top:16px">
      重新輸入代碼
    </button>
  </div>
</div>

<!-- ══ 加入遊戲 ══ -->
<div id="join" class="player-wrap">
  <div class="pl-card">
    <h3>加入遊戲</h3>

    <!-- 第一步：輸入代碼 -->
    <div id="step1">
      <div class="row">
        <label>輸入白板上的 6 位數編號</label>
        <input id="jCode" class="code-input" type="text" inputmode="numeric"
               maxlength="6" placeholder="------" autocomplete="off">
      </div>
      <button id="btnFind" class="primary big-btn">下一步</button>
    </div>

    <!-- 第二步：選組別（只列出這一場實際開的組數） -->
    <div id="step2" class="hidden">
      <div class="found" id="foundInfo"></div>
      <div class="row"><label>你們是第幾組？</label><div id="jGroup" class="chips wrap"></div></div>
      <button id="btnJoin" class="primary big-btn" disabled>加入這一組</button>
      <button id="btnBack" class="ghost" style="width:100%;margin-top:8px">重新輸入代碼</button>
    </div>

    <div class="pl-msg" id="joinMsg"></div>
  </div>
</div>

<!-- ══ 選角 ══ -->
<div id="pick" class="player-wrap hidden">
  <div class="pl-card">
    <h3>選一位科學家（每組不能重複）</h3>
    <div id="pickGrid" class="pick-grid"></div>
    <button id="btnPickOk" class="primary big-btn" disabled style="margin-top:14px">就決定是你了</button>
    <div class="pl-msg" id="pickMsg"></div>
  </div>
</div>

<!-- ══ 遊戲中 ══ -->
<div id="play" class="player-wrap hidden">

  <div class="phase-banner" id="phaseBanner">⏳ 等待開始</div>

  <div class="top-tools">
    <button id="btnMap">🗺️ 查看地圖</button>
    <button id="btnRankP">📊 戰況</button>
    <button id="btnMuteP">🔇</button>
    <button id="btnFullP">⛶ 全螢幕</button>
  </div>

  <!-- 地圖一覽（點按鈕才開） -->
  <div class="map-panel hidden" id="mapPanel">
    <div class="mp-head">
      <div class="mp-tabs">
        <button class="mp-t on" id="tabMap">🗺️ 地圖</button>
        <button class="mp-t" id="tabList">📋 清單</button>
      </div>
      <div class="mp-filters hidden" id="mapFilters">
        <button class="mp-f on" data-f="all">全部</button>
        <button class="mp-f" data-f="land">只看土地</button>
        <button class="mp-f" data-f="mine">我的地</button>
        <button class="mp-f" data-f="free">還沒人買</button>
      </div>
      <button id="btnMapClose" class="mp-close">✕</button>
    </div>

    <div class="mp-canvas" id="mapCanvas">
      <svg id="pMapSvg"></svg>
      <div class="mp-tip" id="mapTip">用手指拖曳可以看地圖的其他地方，點格子看詳細資料</div>
      <div class="mp-zoom">
        <button id="mpZoomIn">＋</button>
        <button id="mpZoomOut">－</button>
        <button id="mpWhole">全島</button>
        <button id="mpMe">找我</button>
      </div>
      <div class="mp-info hidden" id="mapInfo"></div>
    </div>

    <div class="mp-list hidden" id="mapList"></div>
  </div>

  <div class="pl-top">
    <button id="btnLeave" class="leave-btn" title="離開這一組">⇦</button>
    <img id="myAvatar" alt="">
    <div>
      <div class="pl-name" id="myName">第 ? 組</div>
      <div class="pl-stats">
        <span>💰 <b id="myCash">0</b></span>
        <span>🏦 <b id="myBank">0</b></span>
        <span>🎁 <b id="myRp">0</b></span>
        <span id="myLoanWrap" class="hidden">📉 欠 <b id="myLoan">0</b></span>
      </div>
      <div class="pl-stats" style="font-size:13px;color:#93a4bb">
        <span id="myPos">－</span><span id="myState"></span>
      </div>
    </div>
  </div>

  <!-- 答題 -->
  <div class="pl-card hidden" id="qCard">
    <h3>第 <span id="qRound">1</span> 輪　<span id="qLeft"></span></h3>
    <div class="pl-q" id="qText"></div>
    <div id="qOpts"></div>
    <div class="pl-actions" style="margin-top:10px">
      <button id="btnHint">💡 買提示（$500）</button>
      <button id="btnHint2">💡💡 更多提示（$1,000）</button>
    </div>
    <div class="pl-msg" id="hintBox"></div>
  </div>

  <!-- 輪到我行動 -->
  <div class="pl-card hidden" id="actCard">
    <h3 id="actTitle">輪到你了</h3>
    <div id="actBody"></div>
  </div>

  <!-- 手牌 -->
  <div class="pl-card">
    <h3>🎴 我的手牌（<span id="handCount">0</span>/8）</h3>
    <div class="hand" id="handList"></div>
    <button id="btnItemDone" class="hidden" style="width:100%;margin-top:10px;background:#334155">
      ✓ 這輪不出牌了
    </button>
    <div class="pl-msg" id="handMsg"></div>
  </div>

  <!-- 資產 -->
  <div class="pl-card">
    <h3>🏭 我的產業（<span id="assetCount">0</span> 塊）</h3>
    <div class="assets" id="assetList"></div>
  </div>

  <!-- 銀行 -->
  <div class="pl-card">
    <h3>🏦 銀行</h3>
    <div class="pl-msg" id="bankHint">要停在銀行格才能存提款與申請貸款</div>
    <div class="pl-actions">
      <button id="btnDeposit">存款</button>
      <button id="btnWithdraw">提款</button>
      <button id="btnLoan">💰 申請貸款</button>
      <button id="btnRepay">還款</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js?v=20260822-2015"></script>
<script src="js/sound.js?v=20260822-2015"></script>
<script src="js/board.js?v=20260822-2015"></script>
<script src="js/render.js?v=20260822-2015"></script>
<script src="js/characters.js?v=20260822-2015"></script>
<script src="js/cards.js?v=20260822-2015"></script>
<script src="js/engine.js?v=20260822-2015"></script>
<script src="js/store.js?v=20260822-2015"></script>
<script src="js/player.js?v=20260822-2015"></script>
</body>
</html>
