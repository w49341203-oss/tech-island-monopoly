<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1220">
<!-- 安裝成 App（PWA）：從主畫面圖示開啟就是滿版、沒有網址列，也不會滑一下就跑出瀏覽器介面 -->
<link rel="manifest" href="app.webmanifest">
<meta name="apple-mobile-web-app-title" content="科技島">
<link rel="apple-touch-icon" href="images/icons/app-180.png">
<title>科技島大富翁 — 我的平板</title>
<link rel="stylesheet" href="css/style.css?v=20260824-2020">
<script>
// 註冊最小 service worker（只為了「可安裝」，不做任何快取）
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
</script>
</head>
<body class="player">

<!-- ══ 重新連線中 ══ -->
<div id="rejoin" class="player-wrap hidden">
  <div class="pl-card" style="text-align:center">
    <h3>正在回到遊戲…</h3>
    <div class="rejoin-info" id="rejoinInfo"></div>
    <button id="btnCancelRejoin" class="ghost" style="width:100%;margin-top:16px">
      重新輸入代碼
    </button>
  </div>
</div>

<!-- ══ 加入遊戲 ══ -->
<!--
  科技島大富翁 Tech Island Monopoly
  © 2026 蕭妤真 · 科技島大富翁 · 僅供教育用途，歡迎教師參考改作，禁止商業使用
  題庫內容為國中自然科教學用途整理；角色與美術為本專案原創（AI 輔助生成）。
-->
<div id="join" class="player-wrap center">
  <div class="join-brand">
    <img src="images/characters/char_01_newton_idle.png" alt="">
    <div>
      <div class="join-title">科技島大富翁</div>
      <div class="join-sub">輸入白板上的編號加入你的組別</div>
    </div>
    <img src="images/characters/char_19_curie_idle.png" alt="">
  </div>
  <div class="copyright">© 2026 蕭妤真 · 科技島大富翁 · 僅供教育用途，歡迎教師參考改作，禁止商業使用</div>
  <div class="pl-card">
    <h3>加入遊戲</h3>

    <!-- 第一步：輸入代碼 -->
    <div id="step1">
      <div class="row">
        <label>輸入白板上的 6 位數編號</label>
        <input id="jCode" class="code-input" type="text" inputmode="numeric"
               maxlength="6" placeholder="------" autocomplete="off">
      </div>
      <button id="btnFind" class="primary big-btn">下一步</button>
    </div>

    <!-- 第二步：選組別（只列出這一場實際開的組數） -->
    <div id="step2" class="hidden">
      <div class="found" id="foundInfo"></div>
      <div class="row"><label>你們是第幾組？</label><div id="jGroup" class="chips wrap"></div></div>
      <button id="btnJoin" class="primary big-btn" disabled>加入這一組</button>
      <button id="btnBack" class="ghost" style="width:100%;margin-top:8px">重新輸入代碼</button>
    </div>

    <div class="pl-msg" id="joinMsg"></div>
  </div>
</div>

<!-- ══ 選角 ══ -->
<div id="pick" class="player-wrap hidden">
  <div class="pl-card">
    <h3>選一位科學家（每組不能重複）</h3>
    <div id="pickGrid" class="pick-grid"></div>
    <button id="btnPickOk" class="primary big-btn" disabled style="margin-top:14px">就決定是你了</button>
    <div class="pl-msg" id="pickMsg"></div>
    <button id="btnLeavePick" class="ghost" style="width:100%;margin-top:10px">⬅ 離開這一場，回到輸入編號</button>
  </div>
</div>

<!-- ══ 遊戲中 ══ -->
<!-- ══ 本節結束（要放在 play 外面，否則 play 隱藏時它也看不到）══ -->
<div id="ended" class="hidden">
  <div class="ended-box" id="endedBody"></div>
</div>

<div id="play" class="player-wrap hidden">

  <div class="pl-ver" id="plVer"></div>
  <div class="conn-warn hidden" id="connWarn"></div>
  <div class="conn-warn hidden" id="seatWarn"></div>
  <div class="phase-banner" id="phaseBanner">⏳ 等待開始</div>

  <div class="top-tools">
    <button id="btnMap">🗺️ 查看地圖</button>
    <button id="btnRankP">📊 戰況</button>
    <button id="btnMuteP">🔇</button>
    <button id="btnFullP">⛶ 全螢幕</button>
    <button id="btnReload">🔄 重新整理</button>
  </div>

  <!-- 地圖一覽（點按鈕才開） -->
  <div class="map-panel hidden" id="mapPanel">
    <div class="mp-head">
      <div class="mp-tabs">
        <button class="mp-t on" id="tabMap">🗺️ 地圖</button>
        <button class="mp-t" id="tabList">📋 清單</button>
      </div>
      <div class="mp-filters hidden" id="mapFilters">
        <button class="mp-f on" data-f="all">全部</button>
        <button class="mp-f" data-f="land">只看土地</button>
        <button class="mp-f" data-f="mine">我的地</button>
        <button class="mp-f" data-f="free">還沒人買</button>
      </div>
      <button id="btnMapClose" class="mp-close">✕</button>
    </div>

    <div class="mp-canvas" id="mapCanvas">
      <svg id="pMapSvg"></svg>
      <div class="mp-tip" id="mapTip">用手指拖曳可以看地圖的其他地方，點格子看詳細資料</div>
      <div class="mp-zoom">
        <button id="mpZoomIn">＋</button>
        <button id="mpZoomOut">－</button>
        <button id="mpWhole">全島</button>
        <button id="mpMe">找我</button>
      </div>
      <div class="mp-info hidden" id="mapInfo"></div>
    </div>

    <div class="mp-list hidden" id="mapList"></div>
  </div>

  <div class="pl-top">
    <button id="btnLeave" class="leave-btn" title="離開這一組">⇦</button>
    <img id="myAvatar" alt="">
    <div>
      <div class="pl-name" id="myName">第 ? 組</div>
      <div class="pl-stats">
        <span>💰 <b id="myCash">0</b></span>
        <span>🏦 <b id="myBank">0</b></span>
        <span>🎁 <b id="myRp">0</b></span>
        <span id="myLoanWrap" class="hidden">📉 欠 <b id="myLoan">0</b></span>
      </div>
      <div class="pl-stats" style="font-size:14px;color:var(--dim)">
        <span id="myPos">－</span><span id="myState"></span>
      </div>
    </div>
  </div>

  <div class="pg on" id="pgNow">
  <!-- 答題 -->
  <div class="pl-card hidden" id="qCard">
    <h3>第 <span id="qRound">1</span> 輪　<span id="qLeft"></span></h3>
    <div class="pl-q" id="qText"></div>
    <div id="qOpts"></div>
    <div class="pl-actions" style="margin-top:10px">
      <button id="btnHint">💡 買提示（$500）</button>
      <button id="btnHint2">💡💡 更多提示（$1,000）</button>
    </div>
    <div class="pl-msg" id="hintBox"></div>
  </div>

  <!-- 輪到我行動 -->
  <div class="pl-card hidden" id="actCard">
    <h3 id="actTitle">輪到你了</h3>
    <div id="actBody"></div>
  </div>
  <div class="pl-msg" id="nowIdle" style="text-align:center">
    現在沒有需要你操作的事。出題或輪到你們時，畫面會自動跳到這一頁。</div>
  </div><!-- /pgNow -->

  <div class="pg" id="pgHand">
  <!-- 手牌 -->
  <div class="pl-card">
    <h3>🎴 我的手牌（<span id="handCount">0</span>/8）</h3>
    <div class="hand" id="handList"></div>
    <button id="btnItemDone" class="hidden" style="width:100%;margin-top:10px;background:#334155;color:#ffffff">
      ✓ 這輪不出牌了
    </button>
    <div class="pl-msg" id="handMsg"></div>
  </div>
  </div><!-- /pgHand -->

  <div class="pg" id="pgAssets">
  <!-- 資產 -->
  <div class="pl-card">
    <h3>🏭 我的產業（<span id="assetCount">0</span> 塊）</h3>
    <div class="assets" id="assetList"></div>
  </div>
  </div><!-- /pgAssets -->
  <div id="bankCard" class="hidden">

  <!-- 銀行（可收合：整張卡會蓋住中間的操作區） -->
  <div class="pl-card" id="bankBody">
    <h3>🏦 銀行 <button id="btnBankClose" type="button">✕ 收合</button></h3>
    <div class="pl-msg" id="bankHint">要停在銀行格才能存提款與申請貸款</div>
    <div class="pl-actions">
      <button id="btnDeposit">存款</button>
      <button id="btnWithdraw">提款</button>
      <button id="btnLoan">💰 申請貸款</button>
      <button id="btnRepay">還款</button>
    </div>
  </div>
  <button id="btnBankOpen" type="button" class="hidden">🏦 展開銀行選項（存提款、貸款）</button>
  </div><!-- /bankCard -->

  <!-- 底部分頁列：功能一頁一頁切，整個畫面不捲動（防下拉誤觸重新整理）。
       銀行不佔分頁：走到銀行格時才會出現在「現在」頁。 -->
  <div class="pg-tabs" id="pgTabs">
    <button class="pg-t on" data-pg="pgNow">🎯 現在</button>
    <button class="pg-t" data-pg="pgHand">🎴 手牌</button>
    <button class="pg-t" data-pg="pgAssets">🏭 資產</button>
  </div>
</div>

<!-- 直式時的全畫面提示（遊戲畫面設計為橫式） -->
<div id="rotateHint">
  <div>📱↻<br>請把平板／手機<b>轉成橫式</b>再玩<br>
  <span style="font-size:15px;opacity:.85">（畫面是為橫式設計的）</span></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
// 舊平板救援：上面的 Firebase v9 需要新式瀏覽器，太舊的機器會解析失敗。
// 偵測到沒載成功就改載 v8（ES5 版，舊瀏覽器吃得下）；兩版 API 相同。
if (!window.firebase) {
  document.write('<scr' + 'ipt src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"><\/scr' + 'ipt>');
  document.write('<scr' + 'ipt src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"><\/scr' + 'ipt>');
  document.write('<scr' + 'ipt src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"><\/scr' + 'ipt>');
}
</script>
<script src="js/firebase-config.js?v=20260824-2020"></script>
<script src="js/sound.js?v=20260824-2020"></script>
<script src="js/board.js?v=20260824-2020"></script>
<script src="js/render.js?v=20260824-2020"></script>
<script src="js/characters.js?v=20260824-2020"></script>
<script src="js/cards.js?v=20260824-2020"></script>
<script src="js/engine.js?v=20260824-2020"></script>
<script src="js/store.js?v=20260824-2020"></script>
<script src="js/player.js?v=20260824-2020"></script>
</body>
</html>
