<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>科技島大富翁 — 老師端</title>
<link rel="stylesheet" href="css/style.css?v=20260823-2239">
</head>
<body class="teacher">

<!-- ══ 設定畫面 ══ -->
<!--
  科技島大富翁 Tech Island Monopoly
  © 2026 蕭妤真 · 科技島大富翁 · 僅供教育用途，歡迎教師參考改作，禁止商業使用
  題庫內容為國中自然科教學用途整理；角色與美術為本專案原創（AI 輔助生成）。
-->
<div id="setup" class="screen setup">
  <div class="setup-box">
    <div class="brand">
      <img class="brand-char left"  src="images/characters/char_01_newton_idle.png" alt="">
      <div class="brand-text">
        <h1>科技島大富翁</h1>
        <div class="brand-sub">台灣科技業 × 國中理化　全班對戰</div>
      </div>
      <img class="brand-char right" src="images/characters/char_19_curie_idle.png" alt="">
    </div>

    <div class="row">
      <label>接續舊場次</label>
      <div id="savePicker" class="chips wrap"></div>
      <div class="inline" style="margin-top:8px">
        <span>換一台電腦？輸入上次的編號</span>
        <input id="codeInput" class="code-input" maxlength="6" inputmode="numeric"
               autocomplete="off" placeholder="6 位數">
        <button id="btnLoadCode" class="mini">接續這一場</button>
      </div>
      <div class="hint" id="saveHint">開新遊戲會自動產生一組編號，投影給學生輸入</div>
    </div>

    <div class="row">
      <label>這次要考的章節</label>
      <div id="chapterPicker" class="chips wrap"></div>
      <div class="hint" id="qCount">尚未載入題庫</div>
    </div>

    <div class="row">
      <label>設定</label>
      <div class="inline">
        <span>組數</span>
        <select id="groupCount">
          <option value="2">2 組</option>
          <option value="3">3 組</option>
          <option value="4">4 組</option>
          <option value="5">5 組</option>
          <option value="6">6 組</option>
          <option value="7">7 組</option>
          <option value="8">8 組</option>
          <option value="9" selected>9 組</option>
          <option value="10">10 組</option>
        </select>
        <span>本節回合數</span>
        <select id="maxRounds">
          <option value="20">20 輪</option>
          <option value="30" selected>30 輪</option>
          <option value="40">40 輪</option>
        </select>
        <span>語音播報</span>
        <select id="speakLevel">
          <option value="key" selected>重點（推薦）</option>
          <option value="all">詳細（連過路費都唸）</option>
          <option value="off">關閉</option>
        </select>
        <span>輪間休息</span>
        <select id="breakSec">
          <option value="0">手動（我按下一輪）</option>
          <option value="30">30 秒</option>
          <option value="60" selected>60 秒</option>
          <option value="90">90 秒</option>
          <option value="120">2 分鐘</option>
        </select>
        <span>動畫速度</span>
        <select id="animSpeed">
          <option value="1" selected>正常</option>
          <option value="1.6">快</option>
          <option value="2.5">很快</option>
        </select>
        <label class="check"><input type="checkbox" id="allowMerge" checked> 開放併購</label>
        <label class="check"><input type="checkbox" id="allowSabotage" checked> 開放破壞類道具</label>
        <label class="check"><input type="checkbox" id="autoPilot" checked> 沒有平板的組由電腦代打</label>
      </div>
    </div>

    <div class="setup-actions">
      <button id="btnNew" class="big primary">開新遊戲</button>
      <button id="btnSolo" class="big ghost">單機試玩（不用平板）</button>
    </div>
    <div id="setupMsg" class="msg"></div>
    <div class="copyright">© 2026 蕭妤真 · 科技島大富翁 · 僅供教育用途，歡迎教師參考改作，禁止商業使用</div>
  </div>
</div>

<!-- ══ 選角等待畫面 ══ -->
<div id="lobby" class="screen lobby hidden">
  <div class="room-code">
    <div class="rc-label">請各組在平板上輸入這一場的編號</div>
    <div class="rc-code" id="roomCode">------</div>
    <div class="rc-url" id="roomUrl"></div>
  </div>
  <h2 id="lobbyTitle">然後選擇你們的科學家</h2>
  <div id="lobbyGrid" class="lobby-grid"></div>
  <div class="lobby-actions">
    <button id="btnStart" class="big primary" disabled>全部選好了，開始遊戲</button>
    <button id="btnAutoPick" class="big ghost">幫還沒選的組隨機指定</button>
    <div class="hint" id="lobbyHint" style="width:100%;text-align:center"></div>
  </div>
</div>

<!-- ══ 遊戲畫面：只有地圖 ══ -->
<div id="game" class="screen game hidden">
  <svg id="stage"></svg>

  <!-- HUD 疊在地圖上 -->
  <div class="hud">
    <div class="hud-round" id="hudRound">第 1 輪 / 30</div>

    <div class="hud-question hidden" id="hudQuestion">
      <div class="q-timer"><div class="q-bar" id="qBar"></div><span id="qSec">15</span></div>
      <div class="q-text" id="qText"></div>
      <div class="q-options" id="qOptions"></div>
      <div class="q-lights" id="qLights"></div>
    </div>

    <div class="hud-order hidden" id="hudOrder"></div>

    <!-- 道具效果依序播放 -->
    <div class="hud-cast hidden" id="hudCast">
      <div class="cast-no" id="castNo"></div>
      <div class="cast-who" id="castWho"></div>
      <div class="cast-card" id="castCard"></div>
      <div class="cast-desc" id="castDesc"></div>
      <div class="cast-result" id="castResult"></div>
    </div>

    <!-- 輪與輪之間的休息 -->
    <!-- 創投商店不限時間，老師需要一個能強制往下走的出口 -->
    <!-- 大公告：神明附身、機會、命運新聞（仿大富翁4 的大圖＋大字） -->
    <div class="hud-bigevent hidden" id="hudBigEvent">
      <div class="be-art" id="beArt"></div>
      <div class="be-text">
        <div class="be-title" id="beTitle"></div>
        <div class="be-desc" id="beDesc"></div>
      </div>
    </div>

    <div class="hud-waitgroup hidden" id="hudWaitGroup">
      <div class="wg-text" id="wgText">第 1 組 行動中…</div>
      <div class="wg-hint" id="wgHint">等這一組在平板上做完，再按下面的按鍵（或直接按空白鍵）</div>
      <button id="btnNextPlayer">▶ 下一位玩家</button>
    </div>

    <div class="hud-break hidden" id="hudBreak">
      <div class="bk-title" id="bkTitle">第 1 輪結束</div>
      <div class="bk-sec" id="bkSec">60</div>
      <div class="bk-hint" id="bkHint">休息一下，等一下開始下一輪</div>
      <div class="bk-rank" id="bkRank"></div>
      <button id="btnNextRound" class="big primary">▶ 開始下一輪</button>
    </div>

    <div class="hud-item-phase hidden" id="hudItemPhase">
      <div class="ip-title">🎴 道具時間</div>
      <div class="ip-sec" id="ipSec">30</div>
      <div class="ip-hint" id="ipHint">各組可以在平板上使用卡片與道具</div>
      <div class="ip-log" id="ipLog"></div>
    </div>

    <svg class="hud-minimap" id="minimap" viewBox="0 0 300 340"><g id="mmG"></g></svg>

    <div class="hud-player hidden" id="hudPlayer">
      <img id="hpAvatar" alt="">
      <div class="hp-info">
        <div class="hp-name" id="hpName"></div>
        <div class="hp-line">💰 <b id="hpCash">0</b></div>
        <div class="hp-line">🏦 <b id="hpBank">0</b></div>
        <div class="hp-line">🎁 <b id="hpRp">0</b></div>
      </div>
    </div>

    <div class="hud-toast hidden" id="hudToast"></div>

    <div class="hud-dice hidden" id="hudDice">
      <svg viewBox="0 0 420 240"><g id="die1"></g><g id="die2"></g></svg>
      <div class="dice-sum hidden" id="diceSum"></div>
    </div>

    <div class="hud-rank hidden" id="hudRank"></div>
    <div class="hud-ver" id="hudVer">—</div>
    <div class="hud-dots" id="hudDots"></div>
    <div class="hud-code" id="hudCode"></div>
    <button class="hud-mute" id="btnMute" title="音效開關">🔊</button>
  </div>

  <!-- 老師控制列（滑鼠移到底部才出現，不干擾投影） -->
  <div class="teacher-bar">
    <button id="btnPause" class="primary">⏸ 暫停</button>
    <button id="btnRank">📊 排行榜</button>
    <button id="btnZoom">🗺️ 全島</button>
    <button id="btnSave">💾 存檔</button>
    <button id="btnFull">⛶ 全螢幕</button>
    <button id="btnEnd" class="danger">結束本節</button>
    <span class="bar-status" id="barStatus"></span>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js?v=20260823-2239"></script>
<script src="js/sound.js?v=20260823-2239"></script>
<script src="js/speak.js?v=20260823-2239"></script>
<script src="js/bgm.js?v=20260823-2239"></script>
<script src="js/board.js?v=20260823-2239"></script>
<script src="js/characters.js?v=20260823-2239"></script>
<script src="js/cards.js?v=20260823-2239"></script>
<script src="js/questions.js?v=20260823-2239"></script>
<script src="js/engine.js?v=20260823-2239"></script>
<script src="js/render.js?v=20260823-2239"></script>
<script src="js/store.js?v=20260823-2239"></script>
<script src="js/teacher.js?v=20260823-2239"></script>
</body>
</html>
